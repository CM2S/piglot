objective:
  name: design
  # variance: true
  # composite: true
  solver:
    name: curve
    verbosity: all
    cases:
      'case_1':
        expression: <sum> * cos(x) + (<sum>)**2 * sin(x)
        parametric: x
        bounds: [-2, 2]
        points: 21
  targets:
    'minimum_value':
      quantity: square_integral
      prediction: ['case_1']
      maximise: False
      n_points: 21
